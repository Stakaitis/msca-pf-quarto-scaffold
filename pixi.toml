# =====================================================================
#  Reproducible build environment (Pixi).
#  First time:   pixi run setup      (installs a local TeX engine)
#  Every build:  pixi run build      (renders EVERY part + validates all of them)
#  Live preview: pixi run preview
#
#  `pixi run build` is the only sanctioned build. A bare `quarto render`
#  produces a PDF nobody has checked — that is how the 2026-07-28 US Letter /
#  Latin Modern / no-footer render reached the _build directory.
# =====================================================================
[workspace]
name = "msca-pf-proposal"
version = "0.1.0"
description = "MSCA Postdoctoral Fellowship proposal — Quarto scaffold with MSCA formatting baked in."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
quarto = ">=1.5"
python = ">=3.11"
poppler = "*"        # pdfinfo / pdffonts, for eyeballing a PDF by hand
pymupdf = ">=1.24"   # page geometry, fonts and character sizes for the compliance gate
# Gantt chart generation (scripts/gantt/, vendored from lab-tools). Only used
# by `pixi run gantt`; the proposal renders fine without ever running it.
pandas = ">=2.0,<3"        # pandas 3 breaks plotly Timestamp serialisation
plotly = ">=5.20,<6.8"     # 6.9 orjson path cannot serialise pandas Timestamp
pyyaml = ">=6.0"
python-kaleido = "0.2.*"    # v1 serialises via orjson, which chokes on pandas Timestamp

[tasks]
# One-time: install a self-contained TeX (TinyTeX). Quarto then auto-installs
# any missing LaTeX packages (tgtermes, fancyhdr, lastpage, titlesec, ...)
# on the first render.
setup = "quarto install tinytex --no-prompt --update-path"

# THE ENTRY POINT. Renders every part, then validates every rendered PDF
# against the full MSCA formatting rule set. Non-zero exit on any hard failure,
# so a non-compliant PDF cannot be produced without the build saying so.
build = { cmd = "sh scripts/build/render.sh && sh scripts/check/run.sh" }

# Build Part B-1 alone and validate it (faster loop while writing Section 1-3).
pdf = { cmd = "quarto render partB1.qmd && python scripts/check/compliance.py _build/partB1.pdf --part-b1" }

# Build Part B-2 alone and validate it.
b2 = { cmd = "quarto render partB2.qmd && python scripts/check/compliance.py _build/partB2.pdf --no-page-limit" }

# Render both parts to editable Microsoft Word (.docx) for supervisor feedback.
docx = "quarto render partB1.qmd --to docx && quarto render partB2.qmd --to docx"

# Alias kept so old muscle memory still lands on the checked build.
all = { depends-on = ["build"] }

# Live hot-reloading preview while you write (HTML — fast, reacts to edits in
# sections/). Shows prose and flow, NOT pagination: use `pixi run pdf` for that.
preview = "sh scripts/build/preview.sh"

# Word file for a Grammarly / supervisor pass (Grammarly's Word add-in works;
# Grammarly Desktop does not hook into VS Code).
proof = { cmd = "quarto render partB1.qmd --to docx && open _build/partB1.docx" }

# Regenerate the Section 3 Gantt chart from gantt.yaml, at text-column width so
# Quarto never scales it (scaling a vector figure shrinks its labels too).
gantt = "python scripts/gantt/make.py"

# Regenerate the Word reference document (A4/Times/11pt/footer) from pandoc's
# default template. Only needed if the styling values change.
refdoc = "python scripts/word/make_reference.py"


# Re-run the compliance check on the last build, without re-rendering.
check = "sh scripts/check/run.sh"

# Install the git pre-commit hook that blocks committing a non-compliant PDF.
hooks = "sh scripts/hooks/install.sh"

# Remove build artefacts.
clean = "rm -rf _build .quarto *_files *.tex *.pdf"
