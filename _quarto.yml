# =====================================================================
#  Shared build + formatting config for the whole proposal.
#  Enforces every MSCA Part B rule so you can just write prose.
#  You should rarely need to edit this. Content lives in sections/.
# =====================================================================
project:
  output-dir: _build
  # EVERY .qmd that can become a PDF must be listed here. A file left off this
  # list is rendered *standalone* — Quarto does not merge the `format:` block
  # below into it, so it silently comes out as US Letter / Latin Modern with no
  # Adding a new .qmd? Add it here in the same commit, then `pixi run build`.
  render:
    - partB1.qmd
    - partB2.qmd
    - abstract.qmd

format:
  pdf:
    # --- engine + font (Times-compatible, embedded) ---
    # pdfLaTeX + tgtermes is the most portable path and needs no system font
    # install. The font itself (TeX Gyre Termes) is loaded in tex/msca-header.tex,
    # which also maps common Unicode symbols so you can type them directly.
    pdf-engine: pdflatex
    documentclass: article
    classoption: ["11pt", "a4paper"]
    papersize: a4
    fontsize: 11pt
    # --- margins: 16 mm frame (MSCA minimum is 15 mm; the extra 1 mm is a
    #     safety buffer so optical punctuation never measures under 15 mm).
    #     Lower to 15mm for maximum space, or raise for more white space. ---
    geometry:
      # a4paper is repeated here on purpose. papersize + classoption above
      # already ask for A4; geometry is the package that actually writes
      # \pdfpagewidth/\pdfpageheight, and it wins over both. Belt and braces —
      # a stray letterpaper default is what produced the 612x792 render.
      - a4paper
      - top=16mm
      - bottom=16mm
      - left=16mm
      - right=16mm
      - footskip=9mm
    # --- all the font/footer/heading rules ---
    include-in-header: tex/msca-header.tex
    # --- single line spacing (MSCA minimum) ---
    linestretch: 1.0
    # --- MSCA: no cover page, no table of contents, no auto numbering ---
    toc: false
    number-sections: false
    # --- keep links legible in print; only URLs coloured ---
    colorlinks: true
    linkcolor: black
    citecolor: black
    urlcolor: blue
    # --- keep-tex is OFF: it drops partB1.tex/.log into the source dir and
    #     races with `quarto preview`, which fails reading a .log that the
    #     render has already cleaned up. Turn it on only to debug LaTeX. ---
    keep-tex: false

  # --- Word output, styled to match the PDF -------------------------------
  # Without a reference-doc, pandoc's default .docx has no page size, no
  # margins, Calibri/Consolas at 12pt and no footer. This template carries
  # A4 / 16mm / Times New Roman 11pt / "Part B - Page X of Y", so the Word file
  # a supervisor opens looks like the PDF that gets submitted.
  # Regenerate with: pixi run refdoc
  # CAVEAT: Word and TeX break lines differently, so the page COUNT will not
  # match the PDF. The PDF is the authority for the 10-page limit.
  docx:
    reference-doc: tex/msca-reference.docx
    number-sections: false
    toc: false

# --- references: one shared .bib, formatted by Quarto's built-in citeproc ---
bibliography: references.bib
link-citations: true
# Compact numeric (Nature superscript) style — saves space vs author-year.
csl: nature.csl
